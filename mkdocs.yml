site_name: LinkCell
site_description: High-performance periodic linked-cell neighbour lists and k-nearest neighbour search for Rust, C, C++, and Python
site_url: https://linkcell.dseams.info/
repo_url: https://github.com/d-SEAMS/linkcell
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
hooks:
  - scripts/seo.py
exclude_docs: |
  assets/branding/README.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/branding/linkcell-icon.svg
  favicon: assets/branding/linkcell-icon.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy

extra:
  generator: false

extra_css:
  - stylesheets/dseams-tokens.css
  - stylesheets/dseams-family.css
  - stylesheets/dseams-mkdocs.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Tutorials:
      - Two points: tutorials/two-points.md
  - How-to:
      - Embed from C: how-to/embed-c.md
      - Embed from C++: how-to/embed-cpp.md
      - Embed from Python: how-to/embed-python.md
      - pkg-config, Meson and CMake: how-to/pkg-config.md
  - Reference:
      - C API: reference/c-api.md
      - Algorithm: reference/algorithm.md
      - N-dimensional index and DBSCAN: reference/nd.md
      - Features and instruction-set builds: reference/features.md
      - Cell partition: reference/partition.md
      - Rust API: https://linkcell.dseams.info/api/linkcell/
  - Explanation:
      - Minimum image and linked cells: explanation/mic-and-cells.md
      - SIMD paths and dispatch: explanation/simd-paths.md
