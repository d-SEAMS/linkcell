[package]
name = "linkcell"
version = "0.3.3"
edition = "2021"
rust-version = "1.70"
description = "Periodic linked-cell k-nearest neighbour search for molecular simulations"
license = "MIT"
repository = "https://github.com/d-SEAMS/linkcell"
homepage = "https://github.com/d-SEAMS/linkcell"
documentation = "https://docs.rs/linkcell"
keywords = ["molecular-dynamics", "neighbours", "periodic", "cell-list"]
categories = ["science", "algorithms"]
readme = "README.md"

[workspace]
members = ["python"]
resolver = "2"

[lib]
name = "linkcell"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["capi", "parallel"]
capi = []
parallel = ["dep:rayon"]

[dependencies]
minimage = { version = "0.1.1", git = "https://github.com/lode-org/minimage", tag = "v0.1.1" }
rayon = { version = "1.10", optional = true }

[[test]]
name = "abi"
required-features = ["capi"]

[profile.release]
lto = true
codegen-units = 1
