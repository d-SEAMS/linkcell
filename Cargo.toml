[package]
name = "linkcell"
version = "0.3.11"
edition = "2021"
rust-version = "1.70"
description = "Periodic linked-cell cutoff pairs and k-nearest neighbour search"
license = "MIT"
repository = "https://github.com/d-SEAMS/linkcell"
homepage = "https://github.com/d-SEAMS/linkcell"
documentation = "https://docs.rs/linkcell"
keywords = ["molecular-dynamics", "neighbours", "periodic", "cell-list"]
categories = ["science", "algorithms"]
readme = "README.md"

[workspace]
members = ["python"]
resolver = "2"

[lib]
name = "linkcell"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["capi", "parallel"]
capi = []
parallel = ["dep:rayon"]
# Autotuner hooks (`lc_tune_set`, `lc_tune_pairs`) for scripts/tune-pairs.py.
tune = ["capi"]
# Benchmark counters (`SimdTiming`). Off by default.
timing = []
# Serial Scotch (`SCOTCH_graphPart`). Off by default. Not vendored.
scotch = []
# PT-Scotch (`SCOTCH_dgraphPart`). Off by default. Not vendored.
# The caller must already have initialized MPI. The panel uses the
# standalone driver under `mpirun` instead of this feature.
ptscotch = []

[dependencies]
# minimage 0.2 is not on crates.io yet. After it is published, replace the
# git pin below with `minimage = { version = "0.2", default-features = false }`.
minimage = { git = "https://github.com/lode-org/minimage.git", rev = "3abded515f2e3d0af40d8816a533a2941b1a36cf", default-features = false }
rayon = { version = "1.10", optional = true }

[build-dependencies]
cc = "1.2"

[[test]]
name = "abi"
required-features = ["capi"]

[[example]]
name = "simd_bench"
required-features = ["timing"]

[[example]]
name = "partition_panel"

[profile.release]
lto = true
codegen-units = 1
