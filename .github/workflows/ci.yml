name: ci

on:
  push:
    branches:
      - main
      - "perf/**"
      - "fix/**"
      - "feat/**"
      - "ci/**"
      - "release/**"
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: python3 scripts/check-llms-txt.py
      - run: python3 scripts/check-versions.py
      - run: scripts/check-minimage-features.sh
      - name: The tag names the version
        if: github.ref_type == 'tag'
        run: python3 scripts/check-versions.py --tag "$GITHUB_REF_NAME"

  # The Pages build, on every push and pull request, with rustdoc warnings
  # as errors. pages.yml deploys from main only.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Site
        run: |
          mkdir -p docs/assets && cp -a assets/branding docs/assets/branding
          python -m pip install "mkdocs==1.6.1" "mkdocs-material==9.5.49"
          mkdocs build --site-dir _site
      - name: Rust API reference
        env:
          RUSTDOCFLAGS: -D warnings --extend-css assets/rustdoc/dseams-rustdoc.css --html-before-content assets/rustdoc/dseams-rustdoc-before.html --html-in-header assets/rustdoc/dseams-rustdoc-head.html
        run: |
          cargo doc --no-deps --locked --lib
          cp -a target/doc _site/api
          cp assets/rustdoc-index.html _site/api/index.html
          cp llms.txt _site/llms.txt
      # The built site as pages.yml assembles it. --root-dir resolves the
      # site-absolute links in 404.html. The site's own URL is skipped:
      # _site is that site. doi.org redirects to publishers that answer CI
      # runners with 403. static.files holds the rustdoc font licenses.
      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --max-concurrency 4
            --accept 200,206,429
            --extensions md,html
            --root-dir ${{ github.workspace }}/_site
            --exclude '^https://linkcell\.dseams\.info/'
            --exclude '^https://doi\.org/'
            --exclude-path '_site/api/static\.files'
            README.md _site
          token: ${{ secrets.GITHUB_TOKEN }}

  header-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # Pin matches the version comment cbindgen writes into include/linkcell.h.
      - run: cargo install cbindgen --version 0.29.4
      - run: scripts/regen-capi-headers.sh --check

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-py-${{ hashFiles('Cargo.lock', 'python/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-py-
      - name: Install Python test deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install maturin pytest numpy vesin minimage
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: maturin develop
        run: |
          . .venv/bin/activate
          maturin develop
      - name: pytest
        run: |
          . .venv/bin/activate
          pytest tests/python -q

  cargo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        crate:
          - name: default
            flags: ""
          - name: serial
            flags: --no-default-features --features capi
    name: cargo (${{ matrix.os }}, ${{ matrix.crate.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: CPU flags
        shell: bash
        run: |
          echo "arch=$(uname -m)"
          grep -m1 'model name' /proc/cpuinfo || true
          grep -m1 flags /proc/cpuinfo || true
          sysctl -n machdep.cpu.brand_string 2>/dev/null || true
          lscpu || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install Homebrew libomp
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: macOS OpenMP compile and link
        if: runner.os == 'macOS' && matrix.crate.name == 'default'
        run: |
          prefix=$(brew --prefix libomp)
          CC_ENABLE_DEBUG_OUTPUT=1 cargo -vv test --locked --lib --no-run \
            2>&1 | tee "$RUNNER_TEMP/cargo-openmp.log"
          grep -F 'knn_region.c' "$RUNNER_TEMP/cargo-openmp.log" \
            | grep -F '"-fopenmp"'
          grep -F -- "-L native=$prefix/lib" "$RUNNER_TEMP/cargo-openmp.log" \
            | grep -F -- "-l omp"
      - run: cargo test --locked ${{ matrix.crate.flags }}
      - name: SIMD paths exercised
        shell: bash
        run: cargo test --locked ${{ matrix.crate.flags }} --lib simd_paths_exercised -- --nocapture
      - run: cargo clippy --locked --all-targets ${{ matrix.crate.flags }} -- -D warnings

  # The claim in Cargo.toml `rust-version`, tested. The toolchain is that
  # value, read from the file, so the job cannot name a different one. The
  # locked dependencies are the ones CI uses everywhere else; none is
  # downgraded to fit. A rust-version below what the code or a locked
  # dependency needs fails here, and cargo refuses a dependency that
  # declares a newer rust-version.
  msrv:
    name: msrv (${{ matrix.crate.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - name: default
            flags: ""
          - name: serial
            flags: --no-default-features --features capi
          - name: bare
            flags: --no-default-features
          - name: tune-timing-minimage-capi
            flags: --features tune,timing,minimage-capi
          - name: scotch
            flags: --features scotch,ptscotch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-version
        id: msrv
        run: echo "version=$(python3 scripts/check-versions.py --msrv linkcell)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Toolchain is exactly rust-version
        run: |
          rustc --version
          rustc --version | grep -q "^rustc ${{ steps.msrv.outputs.version }} "
      - name: Install Scotch
        if: matrix.crate.name == 'scotch'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libscotch-dev libptscotch-dev libopenmpi-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-msrv-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-msrv-
      - run: cargo build --locked --all-targets ${{ matrix.crate.flags }}
      - run: cargo test --locked ${{ matrix.crate.flags }}

  # The Python module's rust-version in python/Cargo.toml, on exactly that
  # toolchain: the extension builds under every wheel feature set and the
  # Python tests pass against it.
  msrv-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-version
        id: msrv
        run: echo "version=$(python3 scripts/check-versions.py --msrv python)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Toolchain is exactly rust-version
        run: |
          rustc --version
          rustc --version | grep -q "^rustc ${{ steps.msrv.outputs.version }} "
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-msrv-py-${{ hashFiles('Cargo.lock', 'python/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-msrv-py-
      - run: cargo build --locked -p linkcell-python
      - run: cargo build --locked -p linkcell-python --features abi3
      - run: cargo build --locked -p linkcell-python --features abi3t
      - name: maturin develop and pytest
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install maturin pytest numpy
          maturin develop
          pytest tests/python -q

  # The k-nearest region built by Clang calls libomp. The library, the
  # tests and the Meson build must load libomp alone, never libgomp.
  clang-libomp:
    runs-on: ubuntu-latest
    env:
      CC: clang-21
      CXX: clang++-21
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - name: Install Clang 21 and libomp
        run: |
          . /etc/os-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-21 libomp-21-dev
          clang-21 --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-clang-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clang-cargo-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install meson ninja
      - name: Runtime check
        run: |
          cat > "$RUNNER_TEMP/only-libomp.sh" <<'EOF'
          #!/usr/bin/env bash
          # Fail unless every argument needs libomp and no other OpenMP runtime.
          set -euo pipefail
          for lib in "$@"; do
            needed=$(readelf -d "$lib" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
            printf '%s needs:\n%s\n' "$lib" "$needed"
            grep -q '^libomp\.so' <<<"$needed" || { echo "::error::$lib does not need libomp"; exit 1; }
            if grep -E 'gomp|iomp' <<<"$needed"; then
              echo "::error::$lib needs another OpenMP runtime"
              exit 1
            fi
            loaded=$(ldd "$lib")
            echo "$loaded"
            if grep -E 'libgomp|libiomp' <<<"$loaded"; then
              echo "::error::$lib loads another OpenMP runtime"
              exit 1
            fi
          done
          EOF
          chmod +x "$RUNNER_TEMP/only-libomp.sh"
      # The build puts liblinkcell.so where the team test dlopens it.
      - run: cargo build --locked
      - name: liblinkcell.so needs libomp alone
        run: '"$RUNNER_TEMP/only-libomp.sh" target/debug/liblinkcell.so'
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: meson setup build --prefix "$PWD/prefix" --libdir lib
      # An activated conda or pixi environment exports its GCC as CC.
      # Meson's Clang still builds the region.
      - run: meson compile -C build -v
        env:
          CC: gcc
          CC_ENABLE_DEBUG_OUTPUT: '1'
          LINKCELL_CARGO_VERBOSE: '1'
      - run: meson test -C build --print-errorlogs
      - run: meson install -C build
      - name: Installed library and pkg-config
        run: |
          "$RUNNER_TEMP/only-libomp.sh" prefix/lib/liblinkcell.so
          export PKG_CONFIG_PATH="$PWD/prefix/lib/pkgconfig"
          libs=$(pkg-config --static --libs linkcell)
          echo "$libs"
          grep -qw -- -lomp <<<"$libs"
          if grep -w -- -lgomp <<<"$libs"; then exit 1; fi

  # Apple Clang needs Homebrew's keg-only libomp include and library
  # directories. Meson must discover both without caller-supplied flags.
  clang-homebrew-libomp:
    runs-on: macos-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: brew install libomp
      - run: pip install meson ninja
      - run: meson setup build --prefix "$PWD/prefix" --libdir lib
      - name: Homebrew discovery and required OpenMP probe
        run: |
          grep -F 'brew --prefix libomp' build/meson-logs/meson-log.txt
          grep -F 'Has header "omp.h" : YES' build/meson-logs/meson-log.txt
          grep -F 'Library omp found: YES' build/meson-logs/meson-log.txt
      - run: >-
          CC_ENABLE_DEBUG_OUTPUT=1 LINKCELL_CARGO_VERBOSE=1
          meson compile -C build -v 2>&1
          | tee "$RUNNER_TEMP/meson-openmp.log"
      - name: OpenMP compile and link commands
        run: |
          grep -F 'knn_region.c' "$RUNNER_TEMP/meson-openmp.log" \
            | grep -F '"-fopenmp"'
          grep -F 'libomp.dylib' "$RUNNER_TEMP/meson-openmp.log"
      - run: meson test -C build --print-errorlogs
      - run: meson install -C build
      - name: Static consumers link Homebrew libomp
        run: |
          export PKG_CONFIG_PATH="$PWD/prefix/lib/pkgconfig"
          libs=$(pkg-config --static --libs linkcell)
          echo "$libs"
          grep -F -- "$(brew --prefix libomp)/lib/libomp.dylib" <<<"$libs"

  # Clang's -print-file-name does not search LIBRARY_PATH. A libomp the
  # compiler reaches only through LIBRARY_PATH and CPATH, as a sanitizer
  # build of the runtime is, must still be found and linked alone. The
  # packages are unpacked, not installed, so the runner's Clang has no
  # libomp of its own.
  clang-library-path:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install meson ninja
      - name: Unpack libomp 21 into a private prefix
        run: |
          . /etc/os-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          cd "$RUNNER_TEMP"
          apt-get download libomp-21-dev libomp5
          for deb in libomp*.deb; do dpkg -x "$deb" omp; done
          mkdir -p "$RUNNER_TEMP/omp-prefix/lib" "$RUNNER_TEMP/omp-prefix/include"
          cp -a "$RUNNER_TEMP"/omp/usr/lib/x86_64-linux-gnu/libomp.so* \
            "$RUNNER_TEMP/omp-prefix/lib/"
          cp "$RUNNER_TEMP/omp/usr/lib/llvm-21/lib/clang/21/include/omp.h" \
            "$RUNNER_TEMP/omp-prefix/include/"
          lib="$RUNNER_TEMP/omp-prefix/lib"
          inc="$RUNNER_TEMP/omp-prefix/include"
          test -f "$lib/libomp.so" && test -f "$inc/omp.h"
          if [ -f "$(clang -print-file-name=libomp.so)" ]; then
            echo "::error::clang finds a libomp of its own; LIBRARY_PATH would not be exercised"
            exit 1
          fi
          {
            echo "LIBRARY_PATH=$lib"
            echo "CPATH=$inc"
            echo "LD_LIBRARY_PATH=$lib"
            echo "LINKCELL_OMP_LIB=$lib"
          } >> "$GITHUB_ENV"
      - name: Runtime check
        run: |
          cat > "$RUNNER_TEMP/private-libomp.sh" <<'EOF'
          #!/usr/bin/env bash
          # Fail unless every argument loads the private libomp and no other runtime.
          set -euo pipefail
          for lib in "$@"; do
            needed=$(readelf -d "$lib" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
            printf '%s needs:\n%s\n' "$lib" "$needed"
            grep -q '^libomp\.so' <<<"$needed" || { echo "::error::$lib does not need libomp"; exit 1; }
            if grep -E 'gomp|iomp' <<<"$needed"; then
              echo "::error::$lib needs another OpenMP runtime"
              exit 1
            fi
            loaded=$(ldd "$lib")
            echo "$loaded"
            grep -q "libomp\.so.* => $LINKCELL_OMP_LIB/" <<<"$loaded" \
              || { echo "::error::$lib does not load libomp from $LINKCELL_OMP_LIB"; exit 1; }
            if grep -E 'libgomp|libiomp' <<<"$loaded"; then
              echo "::error::$lib loads another OpenMP runtime"
              exit 1
            fi
          done
          EOF
          chmod +x "$RUNNER_TEMP/private-libomp.sh"
      - run: cargo build --locked
      - name: liblinkcell.so needs the private libomp alone
        run: '"$RUNNER_TEMP/private-libomp.sh" target/debug/liblinkcell.so'
      - run: cargo test --locked
      # Meson must discover omp.h beside the lib directory rather than
      # inheriting CPATH, then pass that include path to Cargo's cc crate.
      - run: env -u CPATH meson setup build
      - run: meson compile -C build
      - run: meson test -C build --print-errorlogs
      - name: Meson's liblinkcell.so needs the private libomp alone
        run: '"$RUNNER_TEMP/private-libomp.sh" build/liblinkcell.so'

  # A gcc build whose libgomp.so.1 resolves to LLVM libomp at run time, as
  # in a conda-forge environment with the llvm OpenMP mutex.
  libomp-alias:
    name: cargo (gcc build, libgomp.so.1 -> libomp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install LLVM libomp
        run: sudo apt-get update && sudo apt-get install -y libomp-dev
      - name: Alias libgomp.so.1 to libomp
        run: |
          libomp=$(printf '%s\n' /usr/lib/llvm-*/lib/libomp.so.5 | sort -V | tail -n 1)
          mkdir -p "$RUNNER_TEMP/gomp-alias"
          ln -s "$libomp" "$RUNNER_TEMP/gomp-alias/libgomp.so.1"
          echo "GOMP_ALIAS=$RUNNER_TEMP/gomp-alias" >> "$GITHUB_ENV"
      - name: The test binary loads libomp as libgomp.so.1
        run: |
          exe=$(cargo test --locked --lib --no-run --message-format=json | jq -r 'select(.executable != null) | .executable')
          readelf -d "$exe" | grep -F 'libgomp.so.1'
          LD_LIBRARY_PATH="$GOMP_ALIAS" ldd "$exe" | grep -F "libgomp.so.1 => $GOMP_ALIAS/libgomp.so.1"
      - run: LD_LIBRARY_PATH="$GOMP_ALIAS" cargo test --locked

  # The distribution's clang and libomp-dev: clang answers
  # -print-file-name=libomp.so with the bare name, and build.rs finds the
  # library beside clang's resource directory.
  clang-distro-libomp:
    name: cargo (distribution clang, libomp-dev)
    # 24.04's clang names libomp.so by bare name; 26.04's libomp-dev puts
    # it on clang's own search path.
    runs-on: ubuntu-24.04
    env:
      CC: clang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-clang-distro-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clang-distro-cargo-
      - name: Install clang and libomp-dev
        run: |
          sudo apt-get update && sudo apt-get install -y clang libomp-dev
          clang --version
          if [ -f "$(clang -print-file-name=libomp.so)" ]; then
            echo "::error::clang finds libomp on its own search path; the resource-directory lookup would not be exercised"
            exit 1
          fi
      - name: The test binary links libomp alone
        run: |
          exe=$(env -u LIBRARY_PATH cargo test --locked --lib --no-run --message-format=json | jq -r 'select(.executable != null) | .executable')
          needed=$(readelf -d "$exe" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
          echo "$needed"
          grep -q '^libomp\.so' <<<"$needed"
          if grep -E 'gomp|iomp' <<<"$needed"; then exit 1; fi
      - run: env -u LIBRARY_PATH cargo test --locked

  meson:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: meson (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Configure MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/setup-msvc.ps1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install meson ninja
      - name: Install Homebrew libomp
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Meson setup
        if: runner.os != 'Windows'
        run: meson setup build --prefix "$PWD/prefix" --libdir lib
        shell: bash
      - name: Meson setup
        if: runner.os == 'Windows'
        run: meson setup build --prefix "$env:GITHUB_WORKSPACE/prefix" --libdir lib
        shell: pwsh
      - run: meson compile -C build
      - run: meson test -C build --print-errorlogs
      - run: meson install -C build
      - name: Installed headers and libraries
        shell: bash
        run: |
          prefix="$PWD/prefix"
          test -f "$prefix/include/linkcell.h"
          test -f "$prefix/include/linkcell.hpp"
          test -f "$prefix/include/linkcell_gpu.h"
          test -f "$prefix/include/linkcell_gpu.hpp"
          case "$RUNNER_OS" in
            Windows)
              test -f "$prefix/bin/linkcell.dll"
              test -f "$prefix/lib/linkcell.dll.lib"
              test -f "$prefix/lib/linkcell.lib"
              test -f "$prefix/lib/linkcell_gpu.lib"
              ;;
            macOS)
              test -f "$prefix/lib/liblinkcell.dylib"
              test -f "$prefix/lib/liblinkcell.a"
              test -f "$prefix/lib/liblinkcell_gpu.a"
              ;;
            Linux)
              test -f "$prefix/lib/liblinkcell.so"
              test -f "$prefix/lib/liblinkcell.a"
              test -f "$prefix/lib/liblinkcell_gpu.a"
              ;;
          esac
      - name: pkg-config after meson install
        if: runner.os != 'Windows'
        run: |
          prefix="$PWD/prefix"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          pkg-config --exists --print-errors linkcell
          pkg-config --modversion linkcell
          pkg-config --cflags --libs linkcell
          pkg-config --exists --print-errors linkcell-gpu
          pkg-config --modversion linkcell-gpu
          read -ra gpu_flags <<<"$(pkg-config --cflags --libs linkcell-gpu)"
          c++ -std=c++17 tests/cmake-consumer/gpu.cpp \
            "${gpu_flags[@]}" \
            -o build/installed-gpu-consumer

  cmake:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: cmake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Configure MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/setup-msvc.ps1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install Homebrew libomp
        if: runner.os == 'macOS'
        run: brew install libomp
      - run: >-
          cmake -S . -B build
          -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          -DLINKCELL_CARGO_VERBOSE=ON
        shell: bash
      - name: Build
        if: runner.os != 'macOS'
        run: cmake --build build --config Release --verbose
      - name: Build with OpenMP evidence
        if: runner.os == 'macOS'
        shell: bash
        run: |
          CC_ENABLE_DEBUG_OUTPUT=1 \
            cmake --build build --config Release --verbose 2>&1 \
            | tee "$RUNNER_TEMP/cmake-openmp.log"
          grep -F 'knn_region.c' "$RUNNER_TEMP/cmake-openmp.log" \
            | grep -F '"-fopenmp"'
          grep -F 'libomp.dylib' "$RUNNER_TEMP/cmake-openmp.log"
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: cmake --install build --config Release
      - name: find_package after cmake install
        shell: bash
        run: |
          test -f prefix/include/linkcell.h
          test -f prefix/lib/cmake/linkcell/linkcellConfig.cmake
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            test -f prefix/bin/linkcell.dll
            test -f prefix/lib/linkcell.dll.lib
            test -f prefix/lib/linkcell.lib
            test -f prefix/lib/linkcell_gpu.lib
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            test -f prefix/lib/liblinkcell.dylib
            test -f prefix/lib/liblinkcell.a
            test -f prefix/lib/liblinkcell_gpu.a
          else
            test -f prefix/lib/liblinkcell.so
            test -f prefix/lib/liblinkcell.a
            test -f prefix/lib/liblinkcell_gpu.a
          fi
          cmake -S tests/cmake-consumer -B find-build \
            -DCMAKE_PREFIX_PATH="$PWD/prefix" \
            -DLINKCELL_C_EXAMPLE="$PWD/examples/two_points.c" \
            -DLINKCELL_CPP_EXAMPLE="$PWD/examples/two_points.cpp"
          cmake --build find-build --config Release
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export PATH="$PWD/prefix/bin:$PATH"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            export DYLD_LIBRARY_PATH="$PWD/prefix/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          else
            export LD_LIBRARY_PATH="$PWD/prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          ctest --test-dir find-build -C Release --output-on-failure
      - name: pkg-config after cmake install
        if: runner.os != 'Windows'
        run: |
          test -f prefix/lib/pkgconfig/linkcell.pc
          export PKG_CONFIG_PATH="$PWD/prefix/lib/pkgconfig"
          pkg-config --exists --print-errors linkcell
          pkg-config --modversion linkcell

  # Published crates.io, PyPI, the staged-recipes conda recipe, and the
  # release tag (Meson, CMake, and a Meson wrap), each in a clean prefix.
  # The tag is built with gcc. Clang then installs this tree: Ubuntu's
  # libomp-dev keeps the linker name beside the resource directory, off
  # the default search path.
  published-install:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Compilers and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            clang libomp-dev python3-venv
          python -m pip install meson ninja
          clang --version
      - name: Published artifacts
        env:
          CC: gcc
          CXX: g++
        run: scripts/prove-published-install.sh all
      - name: This tree with Clang
        env:
          CC: clang
          CXX: clang++
        run: scripts/prove-published-install.sh checkout

  static-minimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lode-org/minimage
          ref: e01aea038d55472f9363d1bfe3d9d82fa521651f # main, first commit with the minimage_* C ABI prefix
          path: build/minimage-source
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cmake -S tests/static-minimage -B build/static-minimage -DMINIMAGE_SOURCE="$PWD/build/minimage-source"
      - run: cmake --build build/static-minimage --target static_minimage --parallel 2
      - run: ctest --test-dir build/static-minimage --output-on-failure

  isa-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: CPU flags
        run: |
          echo "arch=$(uname -m)"
          grep -m1 'model name' /proc/cpuinfo || true
          grep -m1 flags /proc/cpuinfo || true
      - name: Unstripped library
        run: |
          cargo build --release --lib --locked
          mkdir -p isa-audit-input
          cp -a target/release/liblinkcell.so isa-audit-input/liblinkcell-x86_64.so
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unstripped-libs
          path: isa-audit-input

  isa-audit:
    needs: isa-build
    permissions:
      contents: read
    uses: OmniPotentRPC/rgpot/.github/workflows/isa-audit.yml@000887fc75392c024eee070f23655f74a0865a15
    with:
      artifact-name: unstripped-libs
      allow-file: isa-allow.toml
      baseline: x86-64
